[project]
name = "monocular-depth-estimation"
version = "0.1.0"
description = "Monocular depth estimation pipeline for 3D localization research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "torchvision>=0.27.0",
    "huggingface_hub>=0.20.0",
    "timm>=0.9.0",
    "einops>=0.6.0",
    "scipy>=1.10.0",
    "ultralytics==8.4.67",
    "lap==0.5.12",
]
